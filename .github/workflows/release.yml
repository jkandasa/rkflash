name: release

# Tags v*: build and publish a release.
# Branch main: rebuild the "devel" pre-release on every push.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# A newer push to main replaces a running devel build. Tag builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", arch: armv7 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          ARCH: ${{ matrix.arch || matrix.goarch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="devel-${GITHUB_SHA::7}"
          fi
          ext=""
          [[ "$GOOS" == windows ]] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/rkflash-${GOOS}-${ARCH}${ext}" ./cmd/rkflash
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rkflash-${{ matrix.goos }}-${{ matrix.arch || matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum rkflash-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the same tag: replace the binaries.
            gh release upload "$tag" dist/* --clobber
          else
            flags=()
            # v1.2.3-rc1 and similar are pre-releases.
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" dist/* --verify-tag \
              --title "rkflash $tag" --generate-notes "${flags[@]}"
          fi

      - name: Publish devel pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          # Remove the old release and its tag, then recreate both at this commit.
          gh release delete devel --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/devel" >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            if gh release create devel dist/* \
                --target "$GITHUB_SHA" --prerelease \
                --title "rkflash devel (${GITHUB_SHA::7})" \
                --notes "Development build of \`main\` at ${GITHUB_SHA}.
          This pre-release and its \`devel\` tag are recreated on every push to \`main\`."; then
              exit 0
            fi
            echo "create failed, retry $i"
            gh release delete devel --cleanup-tag --yes || true
            sleep 5
          done
          exit 1
